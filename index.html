
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FELIZ ANIVERSÁRIO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <div>
            <img src="./047f6354-3717-400b-ad5a-0d61c63d8073.jpg" alt="Lindo">
            <p>PARABÉNS</p>
        </div>
    </main>

    <audio id="audioAniversario" src="./audio.mp3" preload="auto"></audio>

    <script>
        const audio = document.getElementById("audioAniversario");

        function iniciarAudio() {
            audio.play()
                .then(() => {
                    document.removeEventListener("click", iniciarAudio);
                    document.removeEventListener("touchstart", iniciarAudio);
                })
                .catch((erro) => {
                    console.log("Não foi possível iniciar o áudio:", erro);
                });
        }

        document.addEventListener("click", iniciarAudio);
        document.addEventListener("touchstart", iniciarAudio);
    </script>

</body>
</html>
